version: "3"

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./public:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tjaem-network

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    expose:
      - "5678"
    env_file:
      - ../config/.env
    environment:
      - N8N_HOST=portal.tjaembrasil.com.br
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://portal.tjaembrasil.com.br/automation/
      - N8N_PATH=/automation/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tjaem-network

  ai-proxy:
    build:
      context: ../
      dockerfile: infrastructure/ai-proxy.Dockerfile
    restart: always
    env_file:
      - ../config/.env
    expose:
      - "3000"
    networks:
      - tjaem-network

volumes:
  n8n_data:
  caddy_data:
  caddy_config:

networks:
  tjaem-network:
    driver: bridge
